<!DOCTYPE html>
<html lang="hi" class="h-full w-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>टेस्ट प्रदर्शन ट्रैकर (BPSC, UPSC, UPPSC, UGC NET)</title>
  
  <!-- PWA Manifest & App Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f97316">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TestTracker">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3407/3407024.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fffaf5;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scroll::-webkit-scrollbar { display: none; }
    .custom-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-full flex flex-col text-slate-800 pb-24">

  <!-- TOP HEADER (Soft Sunset Light Glow) -->
  <header class="w-full bg-gradient-to-r from-amber-100 via-orange-50 to-rose-100 border-b border-orange-200/80 px-4 py-3 sm:px-8 shadow-sm sticky top-0 z-40">
    <div class="w-full flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-500 to-amber-500 flex items-center justify-center text-white shadow-md shadow-orange-500/20">
          <i class="fa-solid fa-chart-line text-lg"></i>
        </div>
        <div>
          <h1 class="text-lg sm:text-2xl font-black text-slate-900 tracking-tight leading-tight">टेस्ट प्रदर्शन ट्रैकर</h1>
          <p class="text-xs sm:text-sm font-bold text-orange-800 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            ऑफलाइन टेस्ट एनालिटिक्स
          </p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" onclick="openBackupModal(event)" class="px-3.5 py-1.5 rounded-lg bg-orange-600/10 hover:bg-orange-600/20 text-orange-900 border border-orange-300 font-bold text-xs sm:text-sm flex items-center gap-1.5 transition-all">
          <i class="fa-solid fa-cloud-arrow-down"></i>
          <span>डेटा बैकअप</span>
        </button>
        <button type="button" onclick="toggleFullScreen(event)" class="p-2 rounded-lg bg-white/80 hover:bg-white text-slate-700 border border-orange-200 text-sm shadow-sm transition-all" title="फुलस्क्रीन">
          <i class="fa-solid fa-expand"></i>
        </button>
      </div>
    </div>

    <!-- EXAM TABS (High-Contrast Indicator) -->
    <div class="w-full mt-3 flex items-center gap-2 overflow-x-auto custom-scroll pb-1">
      <button onclick="setFilter('ALL')" id="tab-ALL" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-black whitespace-nowrap transition-all shadow-sm">
        <i class="fa-solid fa-layer-group mr-1.5"></i>सभी
      </button>
      <button onclick="setFilter('BPSC')" id="tab-BPSC" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-black whitespace-nowrap transition-all shadow-sm">
        <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block mr-1.5"></span>BPSC
      </button>
      <button onclick="setFilter('UPSC')" id="tab-UPSC" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-black whitespace-nowrap transition-all shadow-sm">
        <span class="w-2 h-2 rounded-full bg-blue-500 inline-block mr-1.5"></span>UPSC CSE
      </button>
      <button onclick="setFilter('UPPSC')" id="tab-UPPSC" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-black whitespace-nowrap transition-all shadow-sm">
        <span class="w-2 h-2 rounded-full bg-amber-500 inline-block mr-1.5"></span>UPPSC
      </button>
      <button onclick="setFilter('NET')" id="tab-NET" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-black whitespace-nowrap transition-all shadow-sm">
        <span class="w-2 h-2 rounded-full bg-purple-500 inline-block mr-1.5"></span>UGC NET
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER (100% Full Width Display) -->
  <main class="w-full px-3 sm:px-8 mt-4 flex-1 space-y-4">

    <!-- KPI CARDS (Big Bold Typography) -->
    <div class="w-full grid grid-cols-3 gap-2.5 sm:gap-4">
      <div class="bg-white p-3 sm:p-5 rounded-2xl border border-orange-100 shadow-sm flex flex-col justify-between">
        <span class="text-xs sm:text-sm font-bold text-slate-500" id="stat-total-label">कुल टेस्ट</span>
        <span class="text-3xl sm:text-5xl font-black text-slate-900 mt-1" id="stat-total-tests">0</span>
      </div>
      <div class="bg-white p-3 sm:p-5 rounded-2xl border border-orange-100 shadow-sm flex flex-col justify-between">
        <span class="text-xs sm:text-sm font-bold text-slate-500">औसत नेट स्कोर</span>
        <span class="text-3xl sm:text-5xl font-black text-emerald-600 mt-1" id="stat-avg-score">0.0</span>
      </div>
      <div class="bg-white p-3 sm:p-5 rounded-2xl border border-orange-100 shadow-sm flex flex-col justify-between">
        <span class="text-xs sm:text-sm font-bold text-slate-500">सर्वोच्च स्कोर</span>
        <span class="text-3xl sm:text-5xl font-black text-orange-600 mt-1" id="stat-max-score">0.0</span>
      </div>
    </div>

    <!-- GRAPH SECTION -->
    <div class="w-full bg-white p-4 sm:p-6 rounded-2xl border border-orange-100 shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-arrow-trend-up text-orange-500 font-bold"></i>
          <h2 class="text-base sm:text-lg font-black text-slate-900" id="graph-heading">स्कोर ट्रेंड (Progression Graph)</h2>
        </div>
        <span id="graph-badge" class="px-2.5 py-1 rounded-full text-xs font-black bg-orange-100 text-orange-800">सभी</span>
      </div>
      <div class="w-full h-52 sm:h-72">
        <canvas id="scoreChart"></canvas>
      </div>
    </div>

    <!-- TEST HISTORY HEADER -->
    <div class="w-full flex items-center justify-between pt-2">
      <h3 class="text-base sm:text-lg font-black text-slate-900 flex items-center gap-2">
        <i class="fa-solid fa-list-check text-orange-500"></i>
        <span id="history-title">टेस्ट इतिहास</span>
      </h3>
      <span class="text-xs font-bold text-slate-500" id="test-count-badge">0 रिकॉर्ड</span>
    </div>

    <!-- TEST LIST CARDS -->
    <div id="testsContainer" class="w-full space-y-3">
      <!-- Injected by JS -->
    </div>
  </main>

  <!-- BOTTOM BAR -->
  <nav class="fixed bottom-0 left-0 right-0 w-full bg-white/95 backdrop-blur-md border-t border-orange-200/80 px-4 py-2 z-40 flex items-center justify-around shadow-lg">
    <button onclick="setFilter('ALL')" class="flex flex-col items-center gap-1 text-slate-600 hover:text-orange-600">
      <i class="fa-solid fa-house text-lg"></i>
      <span class="text-[11px] font-bold">होम</span>
    </button>
    <button onclick="openNewTestModal()" class="-mt-5 w-13 h-13 sm:w-14 sm:h-14 rounded-full bg-gradient-to-tr from-orange-500 to-amber-500 text-white flex items-center justify-center text-xl shadow-lg shadow-orange-500/40 border-4 border-white active:scale-95 transition-all">
      <i class="fa-solid fa-plus"></i>
    </button>
    <button type="button" onclick="openBackupModal(event)" class="flex flex-col items-center gap-1 text-slate-600 hover:text-orange-600">
      <i class="fa-solid fa-shield-halved text-lg"></i>
      <span class="text-[11px] font-bold">बैकअप</span>
    </button>
    <button type="button" onclick="toggleFullScreen(event)" class="flex flex-col items-center gap-1 text-slate-600 hover:text-orange-600">
      <i class="fa-solid fa-expand text-lg"></i>
      <span class="text-[11px] font-bold">फुलस्क्रीन</span>
    </button>
  </nav>

  <!-- NEW TEST MODAL (With Live Math Auto-Sync) -->
  <div id="newTestModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-3 sm:p-4 overflow-y-auto">
    <div class="bg-white w-full max-w-xl rounded-3xl shadow-2xl border border-orange-200 overflow-hidden my-auto">
      <div class="p-4 sm:p-5 bg-gradient-to-r from-amber-50 to-orange-50 border-b border-orange-200 flex items-center justify-between">
        <h3 class="text-base sm:text-lg font-black text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-orange-500"></i>
          नया टेस्ट स्कोर दर्ज करें
        </h3>
        <button onclick="closeNewTestModal()" class="w-8 h-8 rounded-full bg-white text-slate-400 hover:text-slate-700 flex items-center justify-center border border-slate-200">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="testForm" onsubmit="saveTest(event)" class="p-4 sm:p-6 space-y-4">
        <!-- Exam Category Select -->
        <div>
          <label class="block text-xs font-black text-slate-500 uppercase tracking-wider mb-1.5">परीक्षा श्रेणी (Exam Category)</label>
          <div class="grid grid-cols-4 gap-2">
            <button type="button" onclick="selectModalCategory('BPSC')" id="modal-cat-BPSC" class="modal-cat-btn py-2 rounded-xl text-xs sm:text-sm font-black border transition-all text-center">BPSC</button>
            <button type="button" onclick="selectModalCategory('UPSC')" id="modal-cat-UPSC" class="modal-cat-btn py-2 rounded-xl text-xs sm:text-sm font-black border transition-all text-center">UPSC</button>
            <button type="button" onclick="selectModalCategory('UPPSC')" id="modal-cat-UPPSC" class="modal-cat-btn py-2 rounded-xl text-xs sm:text-sm font-black border transition-all text-center">UPPSC</button>
            <button type="button" onclick="selectModalCategory('NET')" id="modal-cat-NET" class="modal-cat-btn py-2 rounded-xl text-xs sm:text-sm font-black border transition-all text-center">NET</button>
          </div>
        </div>

        <!-- Name & Date -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-black text-slate-600 mb-1">टेस्ट का नाम / कोड</label>
            <input type="text" id="inputTestName" required placeholder="उदा. Test 01" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-orange-500">
          </div>
          <div>
            <label class="block text-xs font-black text-slate-600 mb-1">तारीख</label>
            <input type="date" id="inputDate" required class="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-orange-500">
          </div>
        </div>

        <!-- Total Questions & Attempted -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-black text-slate-600 mb-1">कुल प्रश्न (Total)</label>
            <input type="number" id="inputTotal" value="150" min="1" required class="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-orange-500" oninput="handleTotalChange()">
          </div>
          <div>
            <label class="block text-xs font-black text-slate-600 mb-1">कुल अटेम्प्ट (Attempted)</label>
            <input type="number" id="inputAttempted" value="0" min="0" required class="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-orange-500" oninput="handleAttemptedChange()">
          </div>
        </div>

        <!-- Correct & Wrong (Two-way Live Sync) -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-black text-emerald-700 mb-1 flex items-center justify-between">
              <span>सही उत्तर (Correct)</span>
              <span class="text-[10px] font-normal text-slate-400">ऑटो</span>
            </label>
            <input type="number" id="inputCorrect" value="0" min="0" required class="w-full px-3 py-2.5 rounded-xl border-2 border-emerald-400 bg-emerald-50/40 font-black text-emerald-800 text-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" oninput="handleCorrectInput()">
          </div>
          <div>
            <label class="block text-xs font-black text-rose-700 mb-1 flex items-center justify-between">
              <span>गलत उत्तर (Wrong)</span>
              <span class="text-[10px] font-normal text-slate-400">भरें</span>
            </label>
            <input type="number" id="inputWrong" value="0" min="0" required class="w-full px-3 py-2.5 rounded-xl border-2 border-rose-400 bg-rose-50/40 font-black text-rose-800 text-lg focus:outline-none focus:ring-2 focus:ring-rose-500" oninput="handleWrongInput()">
          </div>
        </div>

        <!-- Negative Rate & Cat A -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-black text-amber-700 mb-1">सिली मिस्टेक्स (Cat A)</label>
            <input type="number" id="inputCatA" value="0" min="0" class="w-full px-3 py-2.5 rounded-xl border border-amber-300 bg-amber-50/40 font-bold text-amber-900 focus:outline-none focus:ring-2 focus:ring-amber-500" oninput="validateCatA()">
          </div>
          <div>
            <label class="block text-xs font-black text-slate-600 mb-1">नेगेटिव दर</label>
            <select id="inputNegativeRate" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-orange-500" onchange="calculateLivePreview()">
              <option value="0.3333">1/3 (0.33 BPSC/UPSC/UPPSC)</option>
              <option value="0.25">1/4 (0.25 standard)</option>
              <option value="0.0">कोई नेगेटिव नहीं (UGC NET)</option>
            </select>
          </div>
        </div>

        <!-- Warning Area -->
        <div id="mathWarning" class="hidden p-2.5 rounded-xl bg-rose-100 border border-rose-300 text-rose-800 text-xs font-bold items-center gap-2">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span id="mathWarningText"></span>
        </div>

        <!-- Real-Time Auto-Calculated Score Card -->
        <div class="p-4 rounded-2xl bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 text-white flex items-center justify-between border border-purple-800 shadow-md">
          <div>
            <span class="text-xs font-bold text-amber-300">ऑटो-कैलकुलेटेड नेट स्कोर:</span>
            <div class="text-3xl sm:text-5xl font-black text-amber-400 mt-0.5" id="previewNetScore">0.00</div>
          </div>
          <div class="text-right space-y-1">
            <div class="text-xs font-bold text-slate-300">अन-अटेम्प्ट: <span id="previewUnattempted" class="font-black text-white">0</span></div>
            <div class="text-xs font-bold text-slate-300">सटीकता: <span id="previewAccuracy" class="font-black text-emerald-400">0%</span></div>
          </div>
        </div>

        <!-- Mistake Log Notes -->
        <div>
          <label class="block text-xs font-black text-slate-600 mb-1">Mistake Log नोट्स (सुधार बिंदु)</label>
          <textarea id="inputNotes" rows="2" placeholder="उदा. Q24 में 'नहीं' छूटा, बिहार बजट 2026-27 के आंकड़े रिवीज़न करने हैं..." class="w-full px-3 py-2 rounded-xl border border-slate-300 font-semibold text-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-orange-500 to-amber-500 text-white font-black text-base shadow-lg shadow-orange-500/30 hover:opacity-95 active:scale-98 transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-floppy-disk"></i>
          सुरक्षित करें (Save Test)
        </button>
      </form>
    </div>
  </div>

  <!-- BACKUP & RESTORE MODAL -->
  <div id="backupModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-3 sm:p-4 overflow-y-auto">
    <div class="bg-white w-full max-w-xl rounded-3xl shadow-2xl border border-orange-200 overflow-hidden my-auto">
      <div class="p-4 sm:p-5 bg-gradient-to-r from-amber-50 to-orange-50 border-b border-orange-200 flex items-center justify-between">
        <h3 class="text-base sm:text-lg font-black text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-shield-halved text-orange-500"></i>
          डेटा बैकअप व सुरक्षा केंद्र
        </h3>
        <button type="button" onclick="closeBackupModal()" class="w-8 h-8 rounded-full bg-white text-slate-400 hover:text-slate-700 flex items-center justify-center border border-slate-200">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-4 sm:p-6 space-y-4">
        <!-- Download JSON Button -->
        <button type="button" onclick="exportData()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-black text-sm sm:text-base shadow-md hover:opacity-95 active:scale-98 transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-file-arrow-down text-lg"></i>
          बैकअप फ़ाइल डाउनलोड करें (JSON)
        </button>

        <!-- Quick Share & Copy Buttons -->
        <div class="grid grid-cols-2 gap-2.5">
          <button type="button" onclick="shareBackupNative()" class="py-2.5 px-3 rounded-xl bg-orange-100 hover:bg-orange-200 text-orange-900 font-bold text-xs sm:text-sm flex items-center justify-center gap-2">
            <i class="fa-solid fa-share-nodes text-orange-600"></i>
            शेयर (WhatsApp / Drive)
          </button>
          <button type="button" onclick="copyDataToClipboard()" class="py-2.5 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs sm:text-sm flex items-center justify-center gap-2">
            <i class="fa-solid fa-copy text-slate-600"></i>
            टेक्स्ट कॉपी करें
          </button>
        </div>

        <div class="border-t border-slate-200 pt-3">
          <label class="block text-xs font-black text-slate-600 mb-2">पुराना डेटा वापस लाएँ (Restore Data):</label>
          <input type="file" id="importFileInput" accept=".json" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-orange-500 file:text-white hover:file:bg-orange-600 cursor-pointer">
          
          <div class="mt-3 flex gap-2">
            <button type="button" onclick="handleImportFile(false)" class="flex-1 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-black text-xs">
              जोड़ें (Merge Records)
            </button>
            <button type="button" onclick="handleImportFile(true)" class="flex-1 py-2.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-xs">
              रिप्लेस (Overwrite)
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Register PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then((reg) => console.log('Service Worker Registered:', reg.scope))
          .catch((err) => console.log('Service Worker Registration Failed:', err));
      });
    }

    const STORAGE_KEY = 'offline_mock_tests_records';
    let currentFilter = 'ALL';
    let modalSelectedCategory = 'BPSC';
    let testsData = [];
    let myChart = null;

    // Load initial data
    function initApp() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { testsData = JSON.parse(saved); } catch (e) { testsData = []; }
      }
      // Default to today
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('inputDate').value = today;
      setFilter('ALL');
    }

    function setFilter(category) {
      currentFilter = category;
      const categories = ['ALL', 'BPSC', 'UPSC', 'UPPSC', 'NET'];
      
      categories.forEach(cat => {
        const btn = document.getElementById(`tab-${cat}`);
        if (!btn) return;
        if (cat === category) {
          btn.className = 'tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-black whitespace-nowrap transition-all shadow-md bg-gradient-to-r from-slate-900 to-purple-950 text-amber-300 border-2 border-orange-500 scale-105';
        } else {
          btn.className = 'tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-black whitespace-nowrap transition-all bg-white/80 hover:bg-white text-slate-700 border border-orange-200';
        }
      });

      renderDashboard();
    }

    function renderDashboard() {
      const filtered = currentFilter === 'ALL' ? testsData : testsData.filter(t => t.category === currentFilter);
      
      // Update Stat Labels
      document.getElementById('stat-total-label').innerText = currentFilter === 'ALL' ? 'कुल टेस्ट' : `${currentFilter} टेस्ट`;
      document.getElementById('graph-heading').innerText = currentFilter === 'ALL' ? 'स्कोर ट्रेंड (Progression Graph)' : `${currentFilter} स्कोर ट्रेंड`;
      document.getElementById('graph-badge').innerText = currentFilter === 'ALL' ? 'सभी' : currentFilter;
      document.getElementById('history-title').innerText = currentFilter === 'ALL' ? 'टेस्ट इतिहास' : `${currentFilter} टेस्ट इतिहास`;
      document.getElementById('test-count-badge').innerText = `${filtered.length} रिकॉर्ड`;

      // Calculate Stats
      const totalTests = filtered.length;
      document.getElementById('stat-total-tests').innerText = totalTests;

      if (totalTests === 0) {
        document.getElementById('stat-avg-score').innerText = '0.0';
        document.getElementById('stat-max-score').innerText = '0.0';
      } else {
        const sumScore = filtered.reduce((acc, cur) => acc + parseFloat(cur.netScore || 0), 0);
        const avgScore = (sumScore / totalTests).toFixed(1);
        const maxScore = Math.max(...filtered.map(t => parseFloat(t.netScore || 0))).toFixed(1);
        document.getElementById('stat-avg-score').innerText = avgScore;
        document.getElementById('stat-max-score').innerText = maxScore;
      }

      renderChart(filtered);
      renderTestCards(filtered);
    }

    function renderChart(data) {
      const ctx = document.getElementById('scoreChart').getContext('2d');
      const sorted = [...data].sort((a, b) => new Date(a.date) - new Date(b.date));
      const labels = sorted.map(t => t.name || t.date);
      const scores = sorted.map(t => parseFloat(t.netScore || 0));

      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.length ? labels : ['कोई डेटा नहीं'],
          datasets: [{
            label: 'नेट स्कोर',
            data: scores.length ? scores : [0],
            borderColor: '#ea580c',
            backgroundColor: 'rgba(234, 88, 12, 0.1)',
            fill: true,
            tension: 0.3,
            borderWidth: 3,
            pointBackgroundColor: '#c2410c',
            pointRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } },
            x: { grid: { display: false } }
          }
        }
      });
    }

    function renderTestCards(data) {
      const container = document.getElementById('testsContainer');
      container.innerHTML = '';

      if (data.length === 0) {
        container.innerHTML = `
          <div class="w-full p-8 text-center bg-white rounded-2xl border border-orange-100 text-slate-400">
            <i class="fa-solid fa-file-pen text-3xl mb-2 text-orange-300"></i>
            <p class="font-bold text-sm">कोई टेस्ट रिकॉर्ड नहीं मिला। नीचे '+' बटन दबाकर पहला टेस्ट जोड़ें!</p>
          </div>
        `;
        return;
      }

      data.forEach((t) => {
        const catBadgeColors = {
          'BPSC': 'bg-emerald-100 text-emerald-800 border-emerald-300',
          'UPSC': 'bg-blue-100 text-blue-800 border-blue-300',
          'UPPSC': 'bg-amber-100 text-amber-800 border-amber-300',
          'NET': 'bg-purple-100 text-purple-800 border-purple-300'
        };

        const card = document.createElement('div');
        card.className = 'w-full bg-white p-4 sm:p-5 rounded-2xl border border-orange-100 shadow-sm space-y-3';
        card.innerHTML = `
          <div class="flex items-start justify-between">
            <div>
              <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 rounded-md text-[11px] font-black border ${catBadgeColors[t.category] || 'bg-slate-100 text-slate-700'}">${t.category}</span>
                <h4 class="text-base sm:text-xl font-black text-slate-900">${t.name}</h4>
              </div>
              <p class="text-xs font-bold text-slate-400 mt-1"><i class="fa-regular fa-calendar mr-1"></i>${t.date}</p>
            </div>
            <div class="text-right">
              <span class="text-2xl sm:text-4xl font-black text-orange-600">${t.netScore}</span>
              <span class="block text-[10px] font-bold text-slate-400">नेट अंक</span>
            </div>
          </div>

          <div class="grid grid-cols-4 gap-2 pt-2 border-t border-slate-100 text-center">
            <div class="bg-slate-50 p-2 rounded-xl">
              <span class="block text-[10px] font-bold text-slate-500">अटेम्प्ट</span>
              <span class="text-sm sm:text-base font-black text-slate-800">${t.attempted}</span>
            </div>
            <div class="bg-emerald-50 p-2 rounded-xl">
              <span class="block text-[10px] font-bold text-emerald-700">सही ✔</span>
              <span class="text-sm sm:text-base font-black text-emerald-700">${t.correct}</span>
            </div>
            <div class="bg-rose-50 p-2 rounded-xl">
              <span class="block text-[10px] font-bold text-rose-700">गलत ✖</span>
              <span class="text-sm sm:text-base font-black text-rose-700">${t.wrong}</span>
            </div>
            <div class="bg-amber-50 p-2 rounded-xl">
              <span class="block text-[10px] font-bold text-amber-700">सिली (Cat A)</span>
              <span class="text-sm sm:text-base font-black text-amber-700">${t.catA || 0}</span>
            </div>
          </div>

          ${t.notes ? `
            <div class="p-2.5 rounded-xl bg-orange-50/60 border border-orange-100 text-xs font-semibold text-slate-700">
              <strong class="text-orange-900 font-bold mr-1">सुधार बिंदु:</strong>${t.notes}
            </div>
          ` : ''}
        `;
        container.appendChild(card);
      });
    }

    // Modal & Real-time Auto Sync
    function openNewTestModal() {
      selectModalCategory(currentFilter === 'ALL' ? 'BPSC' : currentFilter);
      document.getElementById('newTestModal').classList.remove('hidden');
      document.getElementById('newTestModal').classList.add('flex');
      calculateLivePreview();
    }

    function closeNewTestModal() {
      document.getElementById('newTestModal').classList.add('hidden');
      document.getElementById('newTestModal').classList.remove('flex');
    }

    function selectModalCategory(cat) {
      modalSelectedCategory = cat;
      ['BPSC', 'UPSC', 'UPPSC', 'NET'].forEach(c => {
        const b = document.getElementById(`modal-cat-${c}`);
        if (!b) return;
        if (c === cat) {
          b.className = 'modal-cat-btn py-2 rounded-xl text-xs sm:text-sm font-black border-2 border-orange-500 bg-orange-500 text-white shadow-sm';
        } else {
          b.className = 'modal-cat-btn py-2 rounded-xl text-xs sm:text-sm font-black border border-slate-200 bg-slate-50 text-slate-700';
        }
      });

      // Default negative marking
      const rateSelect = document.getElementById('inputNegativeRate');
      if (cat === 'NET') {
        rateSelect.value = '0.0';
      } else {
        rateSelect.value = '0.3333';
      }
      calculateLivePreview();
    }

    function handleTotalChange() {
      const total = parseInt(document.getElementById('inputTotal').value) || 0;
      const attEl = document.getElementById('inputAttempted');
      if (parseInt(attEl.value) > total) attEl.value = total;
      handleAttemptedChange();
    }

    function handleAttemptedChange() {
      const att = parseInt(document.getElementById('inputAttempted').value) || 0;
      const wrong = parseInt(document.getElementById('inputWrong').value) || 0;
      const correctEl = document.getElementById('inputCorrect');

      if (wrong <= att) {
        correctEl.value = att - wrong;
      } else {
        document.getElementById('inputWrong').value = 0;
        correctEl.value = att;
      }
      validateCatA();
      calculateLivePreview();
    }

    function handleWrongInput() {
      const att = parseInt(document.getElementById('inputAttempted').value) || 0;
      let wrong = parseInt(document.getElementById('inputWrong').value) || 0;
      const correctEl = document.getElementById('inputCorrect');

      if (wrong > att) {
        wrong = att;
        document.getElementById('inputWrong').value = wrong;
      }
      correctEl.value = Math.max(0, att - wrong);
      validateCatA();
      calculateLivePreview();
    }

    function handleCorrectInput() {
      const att = parseInt(document.getElementById('inputAttempted').value) || 0;
      let correct = parseInt(document.getElementById('inputCorrect').value) || 0;
      const wrongEl = document.getElementById('inputWrong');

      if (correct > att) {
        correct = att;
        document.getElementById('inputCorrect').value = correct;
      }
      wrongEl.value = Math.max(0, att - correct);
      validateCatA();
      calculateLivePreview();
    }

    function validateCatA() {
      const wrong = parseInt(document.getElementById('inputWrong').value) || 0;
      const catAEl = document.getElementById('inputCatA');
      if (parseInt(catAEl.value) > wrong) {
        catAEl.value = wrong;
      }
    }

    function calculateLivePreview() {
      const total = parseInt(document.getElementById('inputTotal').value) || 0;
      const attempted = parseInt(document.getElementById('inputAttempted').value) || 0;
      const correct = parseInt(document.getElementById('inputCorrect').value) || 0;
      const wrong = parseInt(document.getElementById('inputWrong').value) || 0;
      const negRate = parseFloat(document.getElementById('inputNegativeRate').value) || 0;

      const warnBox = document.getElementById('mathWarning');
      const warnText = document.getElementById('mathWarningText');
      const submitBtn = document.getElementById('submitBtn');

      if (correct + wrong !== attempted) {
        warnBox.classList.remove('hidden');
        warnBox.classList.add('flex');
        warnText.innerText = `त्रुटि: सही (${correct}) + गलत (${wrong}) = ${correct + wrong}, जो कुल अटेम्प्ट (${attempted}) के बराबर नहीं है!`;
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-50');
      } else {
        warnBox.classList.add('hidden');
        warnBox.classList.remove('flex');
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50');
      }

      const netScore = Math.max(0, (correct - (wrong * negRate))).toFixed(2);
      const unattempted = Math.max(0, total - attempted);
      const accuracy = attempted > 0 ? Math.min(100, ((correct / attempted) * 100)).toFixed(1) : '0';

      document.getElementById('previewNetScore').innerText = netScore;
      document.getElementById('previewUnattempted').innerText = unattempted;
      document.getElementById('previewAccuracy').innerText = accuracy + '%';
    }

    function saveTest(e) {
      e.preventDefault();
      const test = {
        id: Date.now(),
        category: modalSelectedCategory,
        name: document.getElementById('inputTestName').value.trim(),
        date: document.getElementById('inputDate').value,
        total: parseInt(document.getElementById('inputTotal').value) || 0,
        attempted: parseInt(document.getElementById('inputAttempted').value) || 0,
        correct: parseInt(document.getElementById('inputCorrect').value) || 0,
        wrong: parseInt(document.getElementById('inputWrong').value) || 0,
        catA: parseInt(document.getElementById('inputCatA').value) || 0,
        netScore: document.getElementById('previewNetScore').innerText,
        notes: document.getElementById('inputNotes').value.trim()
      };

      testsData.unshift(test);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(testsData));
      closeNewTestModal();
      document.getElementById('testForm').reset();
      renderDashboard();
    }

    // Backup & Restore
    function openBackupModal(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      document.getElementById('backupModal').classList.remove('hidden');
      document.getElementById('backupModal').classList.add('flex');
    }

    function closeBackupModal() {
      document.getElementById('backupModal').classList.add('hidden');
      document.getElementById('backupModal').classList.remove('flex');
    }

    function exportData() {
      const dataStr = JSON.stringify(testsData, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `mock_tracker_backup_${new Date().toISOString().split('T')[0]}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function shareBackupNative() {
      const dataStr = JSON.stringify(testsData, null, 2);
      if (navigator.share) {
        navigator.share({
          title: 'Mock Test Backup',
          text: dataStr
        }).catch(() => copyDataToClipboard());
      } else {
        copyDataToClipboard();
      }
    }

    function copyDataToClipboard() {
      const dataStr = JSON.stringify(testsData, null, 2);
      navigator.clipboard.writeText(dataStr).then(() => {
        alert('डेटा क्लिपबोर्ड में कॉपी हो गया!');
      }).catch(() => {
        alert('कॉपी नहीं हो सका, कृपया फ़ाइल डाउनलोड करें।');
      });
    }

    function handleImportFile(overwrite) {
      const fileInput = document.getElementById('importFileInput');
      if (!fileInput.files.length) {
        alert('कृपया पहले एक JSON फ़ाइल चुनें!');
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported)) throw new Error('अमान्य फ़ाइल प्रारूप');
          
          if (overwrite) {
            testsData = imported;
          } else {
            const existingIds = new Set(testsData.map(t => t.id));
            imported.forEach(t => {
              if (!existingIds.has(t.id)) testsData.push(t);
            });
          }
          localStorage.setItem(STORAGE_KEY, JSON.stringify(testsData));
          renderDashboard();
          closeBackupModal();
          alert('डेटा सफलतापूर्वक पुनर्प्राप्त (Restored) हो गया!');
        } catch (err) {
          alert('फ़ाइल लोड करने में त्रुटि: अमान्य JSON फ़ाइल');
        }
      };
      reader.readAsText(fileInput.files[0]);
    }

    function toggleFullScreen(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
